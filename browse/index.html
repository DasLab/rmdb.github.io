---
layout: default
title: Browse
---
<section class="browse">
  <h1>Browse entries</h1>

  <div class="browse-controls">
    <input id="q" type="search" placeholder="Filter by ID, name, author, PMID…" aria-label="Filter entries">
    <select id="cat" aria-label="Category">
      <option value="">All categories</option>
      <option value="General">General</option>
      <option value="RNA_Puzzles">RNA Puzzles</option>
      <option value="Eterna">Eterna</option>
    </select>
    <span id="count" class="muted"></span>
  </div>

  <table class="browse-table">
    <thead>
      <tr>
        <th>Thumbnail</th>
        <th>RMDB ID</th>
        <th>Name</th>
        <th>Authors</th>
        <th>Constructs</th>
        <th>Data pts</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
  </table>
</section>

<script>window.MANIFEST_URL = "{{ '/manifest.json' | relative_url }}";</script>
<script src="{{ '/assets/js/search.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
